<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo}">Formulário</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
        @layer components {
            .campo { @apply block w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-slate-900 outline-none focus:border-teal-600 focus:ring-2 focus:ring-teal-100; }
            .rotulo { @apply mb-2 block text-sm font-medium text-slate-700; }
            .erro { @apply mt-1 text-sm text-red-700; }
            .campo[aria-invalid="true"] { @apply border-red-600 ring-1 ring-red-200; }
        }
    </style>
    <script th:if="${validar}" src="https://code.jquery.com/jquery-3.7.1.min.js" defer></script>
    <script src="/js/main.js" defer></script>
    <script th:if="${validar}" src="/js/validation.js" defer></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-900">
<main class="mx-auto max-w-4xl px-4 py-10 sm:px-6">
    <a href="/" class="font-medium text-teal-800 hover:underline">← Voltar às atividades</a>
    <div class="mt-6 overflow-hidden rounded-2xl bg-white shadow-sm ring-1 ring-slate-200">
        <header class="bg-slate-950 px-6 py-8 text-white sm:px-10">
            <p class="text-sm uppercase tracking-widest text-teal-300" th:text="${somenteEndereco ? 'Atividade 02 · ViaCEP' : (validar ? 'Atividade 04 · Validação com jQuery' : 'Atividade 03 · Spring MVC')}"></p>
            <h1 class="mt-2 text-3xl font-bold" th:text="${titulo}"></h1>
            <p class="mt-3 text-slate-300">Preencha os campos abaixo. Este exercício verifica os dados sem armazenar o cadastro.</p>
        </header>
        <form id="cadastro-form" class="space-y-8 p-6 sm:p-10" novalidate th:attr="data-validar=${validar}">
            <fieldset th:unless="${somenteEndereco}">
                <legend class="mb-5 text-lg font-semibold">Dados pessoais</legend>
                <div class="grid gap-5 sm:grid-cols-2">
                    <div><label class="rotulo" for="nome">Nome</label><input class="campo" id="nome" name="nome" autocomplete="given-name" maxlength="100" required aria-describedby="nome-erro"><p class="erro" id="nome-erro"></p></div>
                    <div><label class="rotulo" for="sobrenome">Sobrenome</label><input class="campo" id="sobrenome" name="sobrenome" autocomplete="family-name" maxlength="100" required aria-describedby="sobrenome-erro"><p class="erro" id="sobrenome-erro"></p></div>
                    <div class="sm:col-span-2"><label class="rotulo" for="email">E-mail</label><input class="campo" id="email" name="email" type="email" autocomplete="email" maxlength="254" required aria-describedby="email-erro"><p class="erro" id="email-erro"></p></div>
                    <div><label class="rotulo" for="senha">Senha (mínimo de 8 caracteres)</label><input class="campo" id="senha" name="senha" type="password" autocomplete="new-password" minlength="8" required aria-describedby="senha-erro"><p class="erro" id="senha-erro"></p></div>
                    <div><label class="rotulo" for="confirmacao">Confirmação de senha</label><input class="campo" id="confirmacao" name="confirmacao" type="password" autocomplete="new-password" required aria-describedby="confirmacao-erro"><p class="erro" id="confirmacao-erro"></p></div>
                </div>
            </fieldset>
            <fieldset>
                <legend class="mb-5 text-lg font-semibold">Endereço</legend>
                <div class="grid gap-5 sm:grid-cols-6">
                    <div class="sm:col-span-3"><label class="rotulo" for="cep">CEP</label><div class="flex gap-2"><input class="campo min-w-0" id="cep" name="cep" inputmode="numeric" autocomplete="postal-code" placeholder="00000-000" maxlength="9" required aria-describedby="cep-erro cep-status"><button id="buscar-cep" type="button" class="rounded-lg bg-teal-700 px-4 font-medium text-white hover:bg-teal-800 disabled:opacity-50">Buscar</button></div><p class="erro" id="cep-erro"></p></div>
                    <p id="cep-status" role="status" class="self-center text-sm text-slate-600 sm:col-span-3">Informe o CEP e clique em Buscar ou saia do campo.</p>
                    <div class="sm:col-span-4"><label class="rotulo" for="rua">Rua</label><input class="campo" id="rua" name="rua" autocomplete="address-line1" required aria-describedby="rua-erro"><p class="erro" id="rua-erro"></p></div>
                    <div class="sm:col-span-2"><label class="rotulo" for="bairro">Bairro</label><input class="campo" id="bairro" name="bairro" required aria-describedby="bairro-erro"><p class="erro" id="bairro-erro"></p></div>
                    <div class="sm:col-span-4"><label class="rotulo" for="cidade">Cidade</label><input class="campo" id="cidade" name="cidade" autocomplete="address-level2" required aria-describedby="cidade-erro"><p class="erro" id="cidade-erro"></p></div>
                    <div class="sm:col-span-2"><label class="rotulo" for="estado">Estado (UF)</label><select class="campo" id="estado" name="estado" autocomplete="address-level1" required aria-describedby="estado-erro"><option value="">Selecione</option><option th:each="uf : ${ {'AC','AL','AP','AM','BA','CE','DF','ES','GO','MA','MT','MS','MG','PA','PB','PR','PE','PI','RJ','RN','RS','RO','RR','SC','SP','SE','TO'} }" th:value="${uf}" th:text="${uf}"></option></select><p class="erro" id="estado-erro"></p></div>
                    <div class="sm:col-span-2"><label class="rotulo" for="numero">Número</label><input class="campo" id="numero" name="numero" placeholder="123 ou S/N" required aria-describedby="numero-erro"><p class="erro" id="numero-erro"></p></div>
                    <div class="sm:col-span-4"><label class="rotulo" for="complemento">Complemento <span th:unless="${validar}">(opcional)</span></label><input class="campo" id="complemento" name="complemento" placeholder="Apartamento, bloco ou Não se aplica" autocomplete="address-line2" th:required="${validar}" aria-describedby="complemento-erro"><p class="erro" id="complemento-erro"></p></div>
                </div>
            </fieldset>
            <p id="resultado" role="status" aria-live="polite" class="rounded-lg bg-slate-100 p-4 text-sm" hidden></p>
            <div class="flex flex-wrap gap-3 border-t border-slate-200 pt-6"><button type="submit" class="rounded-lg bg-teal-700 px-6 py-3 font-semibold text-white hover:bg-teal-800 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-teal-700" th:text="${validar ? 'Validar cadastro' : 'Verificar formulário'}"></button><button type="reset" class="rounded-lg border border-slate-300 px-6 py-3 font-medium hover:bg-slate-50">Limpar</button></div>
        </form>
    </div>
</main>
</body>
</html>
